{% extends 'base.html' %}

{% block title %}Sign In - Food Rescue Management System{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 480px;">
    <div style="text-align: center; font-size: 2rem; margin-bottom: 0.5rem;">🔐</div>
    <h2 class="form-title">Welcome Back</h2>
    <p class="form-subtitle">
        Sign in to your Food Rescue account.
    </p>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label class="form-label" for="username_or_email">Username or Email</label>
            <input type="text" class="form-control" id="username_or_email" name="username_or_email" 
                   value="{{ username_or_email|default:'' }}" required placeholder="Enter username or email" autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" 
                   required placeholder="Enter your password">
        </div>

        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary btn-lg btn-full">Sign In</button>
        </div>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 1.25rem;">
            Don't have an account yet? <a href="{% url 'signup' %}"><strong>Create one here</strong></a>
            <div style="margin-top: 0.5rem;">
                <a href="{% url 'view_food' %}" style="font-size: 0.85rem; color: var(--text-muted);">
                    &larr; Browse available food without logging in
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
